services:
  lnurl-server:
    image: ghcr.io/pycanis/lnurl-server:latest
    ports:
      - "8080:8080"
    volumes:
      - ./docker-data/config.yaml:/app/config.yaml:ro
      - ./docker-data/data:/app/data
      - ./docker-data/tls.cert:/certs/tls.cert:ro
      - ./docker-data/admin.macaroon:/macaroons/admin.macaroon:ro
    restart: unless-stopped
