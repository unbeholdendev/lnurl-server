lnd:
  host: "lnd:10009"

ntfy:
  url: "https://ntfy.yourdomain.com"
  topic: "lightning-payments"
  token: ""

withdraw:
  - id: "tip-001"
    domain: "tips.yourdomain.com"
    description: "Restaurant tip"
    amount: 500000

  - id: "tip-002"
    domain: "tips.yourdomain.com"
    description: "Restaurant tip"
    amount: 500000

  - prefix: "tip-batch"
    domain: "tips.otherdomain.com"
    description: "Restaurant tip"
    amount: 500000
    count: 20

addresses:
  # Addresses are served on whatever domain the request arrives on.
  # Wildcard: accepts any username
  "*":
    description: "Lightning Address"
    min_sendable: 1000
    max_sendable: 1000000000

  # Explicit entry takes priority over wildcard
  satoshi:
    description: "Satoshi's Lightning Address"
    min_sendable: 1000
    max_sendable: 1000000000

  hal:
    description: "Hal's Lightning Address"
    min_sendable: 1000
    max_sendable: 1000000000
