lnd:
  host: "lnd:10009"
  tls_cert_path: "/certs/tls.cert"
  macaroon_path: "/macaroons/admin.macaroon"

ntfy:
  url: "https://ntfy.yourdomain.com"
  topic: "lightning-payments"
  token: ""

withdraw:
  - id: "tip-001"
    domain: "tips.yourdomain.com"
    description: "Restaurant tip"
    amount: 500000

  - id: "tip-002"
    domain: "tips.yourdomain.com"
    description: "Restaurant tip"
    amount: 500000

  - prefix: "tip-batch"
    domain: "tips.otherdomain.com"
    description: "Restaurant tip"
    amount: 500000
    count: 20

addresses:
  # Wildcard: accepts any username (e.g., anything@pay.yourdomain.com)
  "*":
    domain: "pay.yourdomain.com"
    description: "Lightning Address"
    min_sendable: 1000
    max_sendable: 1000000000

  # Explicit entry takes priority over wildcard
  satoshi:
    domain: "pay.yourdomain.com"
    description: "Satoshi's Lightning Address"
    min_sendable: 1000
    max_sendable: 1000000000

  hal:
    domain: "tips.otherdomain.com"
    description: "Hal's Lightning Address"
    min_sendable: 1000
    max_sendable: 1000000000
